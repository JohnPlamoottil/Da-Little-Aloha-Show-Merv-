<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>
      .title { font: 700 56px "Arial", sans-serif; fill: #1f2937; }
      .weekday { font: 600 26px "Arial", sans-serif; fill: #6b7280; }
      .day { font: 500 26px "Arial", sans-serif; fill: #111827; }
      .muted { fill: #e5e7eb; }
      .bg { fill: #ffffff; }
      .card { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 3; }
      .header { fill: #f3f4f6; }
    </style>
  </defs>
  <rect width="1200" height="900" class="bg" />
  <rect x="80" y="60" width="1040" height="780" rx="28" class="card" />
  <rect x="80" y="60" width="1040" height="140" rx="28" class="header" />
  <text x="600" y="145" text-anchor="middle" class="title">February 2026</text>

  <!-- Weekday headers -->
  <g transform="translate(120, 240)">
    <text x="0" y="0" class="weekday">Sun</text>
    <text x="150" y="0" class="weekday">Mon</text>
    <text x="300" y="0" class="weekday">Tue</text>
    <text x="450" y="0" class="weekday">Wed</text>
    <text x="600" y="0" class="weekday">Thu</text>
    <text x="750" y="0" class="weekday">Fri</text>
    <text x="900" y="0" class="weekday">Sat</text>
  </g>

  <!-- Grid -->
  <g transform="translate(100, 270)">
    <!-- Rows -->
    <g>
      <!-- Row 1: 1-7 -->
      <text x="20" y="70" class="day">1</text>
      <text x="170" y="70" class="day">2</text>
      <text x="320" y="70" class="day">3</text>
      <text x="470" y="70" class="day">4</text>
      <text x="620" y="70" class="day">5</text>
      <text x="770" y="70" class="day">6</text>
      <text x="920" y="70" class="day">7</text>

      <!-- Row 2: 8-14 -->
      <text x="20" y="180" class="day">8</text>
      <text x="170" y="180" class="day">9</text>
      <text x="320" y="180" class="day">10</text>
      <text x="470" y="180" class="day">11</text>
      <text x="620" y="180" class="day">12</text>
      <text x="770" y="180" class="day">13</text>
      <text x="920" y="180" class="day">14</text>

      <!-- Row 3: 15-21 -->
      <text x="20" y="290" class="day">15</text>
      <text x="170" y="290" class="day">16</text>
      <text x="320" y="290" class="day">17</text>
      <text x="470" y="290" class="day">18</text>
      <text x="620" y="290" class="day">19</text>
      <text x="770" y="290" class="day">20</text>
      <text x="920" y="290" class="day">21</text>

      <!-- Row 4: 22-28 -->
      <text x="20" y="400" class="day">22</text>
      <text x="170" y="400" class="day">23</text>
      <text x="320" y="400" class="day">24</text>
      <text x="470" y="400" class="day">25</text>
      <text x="620" y="400" class="day">26</text>
      <text x="770" y="400" class="day">27</text>
      <text x="920" y="400" class="day">28</text>
    </g>

    <!-- Light guide lines -->
    <g stroke="#e5e7eb" stroke-width="2">
      <line x1="0" y1="20" x2="1000" y2="20" />
      <line x1="0" y1="130" x2="1000" y2="130" />
      <line x1="0" y1="240" x2="1000" y2="240" />
      <line x1="0" y1="350" x2="1000" y2="350" />
      <line x1="0" y1="460" x2="1000" y2="460" />

      <line x1="0" y1="20" x2="0" y2="460" />
      <line x1="150" y1="20" x2="150" y2="460" />
      <line x1="300" y1="20" x2="300" y2="460" />
      <line x1="450" y1="20" x2="450" y2="460" />
      <line x1="600" y1="20" x2="600" y2="460" />
      <line x1="750" y1="20" x2="750" y2="460" />
      <line x1="900" y1="20" x2="900" y2="460" />
      <line x1="1000" y1="20" x2="1000" y2="460" />
    </g>
  </g>
</svg>
